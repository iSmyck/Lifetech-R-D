services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - bmad-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    networks:
      - bmad-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:pass@postgres:5432/bmad
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - LITELLM_URL=http://litellm:4000
      - JWT_SECRET=dev-secret-change-me-in-production
      - MOCK_AI=true
    ports:
      - "8000:8000"
    volumes:
      - ../_bmad:/app/_bmad:ro
      - ../.agents:/app/.agents:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - bmad-net
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:pass@postgres:5432/bmad
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - LITELLM_URL=http://litellm:4000
      - JWT_SECRET=dev-secret-change-me-in-production
      - MOCK_AI=true
    volumes:
      - ../_bmad:/app/_bmad:ro
      - ../.agents:/app/.agents:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - bmad-net
    command: celery -A src.tasks worker --loglevel=info

  postgres:
    image: pgvector/pgvector:pg15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=bmad
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d bmad"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bmad-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - bmad-net

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - bmad-net

  litellm:
    image: ghcr.io/berriai/litellm:main
    environment:
      - LITELLM_CONFIG=/app/config.yaml
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    networks:
      - bmad-net

volumes:
  postgres_data:
  minio_data:

networks:
  bmad-net:
    driver: bridge
